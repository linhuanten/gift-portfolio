<!DOCTYPE html>
<!--
====================================================================
  礼物设计师 · 个人作品集展示网站（纯前端单文件）
====================================================================
  · 全部 HTML / CSS / JS 内联，无需后端、无需数据库
  · 仅引入一个必要 CDN：QRCode.js（分享弹窗二维码）
  · 封面图默认由 SVG 渐变自动生成，离线即可预览；
    将 CONFIG 中的 cover / media[].src 改成你的图片或视频路径即可

  【如何修改内容】
    1. 打开本文件，定位到下方 <script> 顶部 “===== 配置区 CONFIG =====”
    2. 修改 SITE（品牌名/标语/版权）、ABOUT（关于我）、
       CONTACTS（联系方式）、CATEGORIES（分类）、WORKS（作品）
    3. 图片/视频用文件路径或网络 URL 替换空字符串 "" 即可

  【如何添加素材】
    · 在 WORKS 数组里复制一个作品对象，改 id（唯一）、title、
      category（必须是 CATEGORIES 中的值）、cover（封面路径）、
      media（图片/视频数组，type: "image" | "video"）、intro（介绍）
    · 本地图片建议放在同目录，例如 "works/star-box.jpg"

  【如何本地预览】
    · 直接双击本文件用浏览器打开即可
    · 或启动本地服务（推荐，避免个别浏览器限制）：
        python -m http.server 8080
      然后访问 http://localhost:8080/portfolio.html

  【编辑入口（隐藏）】
    · 鼠标停靠到页面右下角，会出现一个极小的圆点
    · 在 2 秒内连续点击 4 次圆点，进入编辑面板
    · 编辑内容会保存在浏览器 IndexedDB（容量大，支持视频），刷新不丢失
====================================================================
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>礼物设计师 · 作品集</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
/* ===================================================================
   全局变量 & 基础
=================================================================== */
:root{
  --blue:#3b6bff;      /* 电光蓝 */
  --purple:#a855f7;    /* 香芋紫 */
  --pink:#ff6f9d;      /* 珊瑚粉 */
  --bg:#070710;        /* 深色基底 */
  --bg-soft:#0e0e1c;
  --text:#f4f4fb;
  --text-dim:#a7a7c4;
  --grad:linear-gradient(120deg,var(--blue),var(--purple) 50%,var(--pink));
  --glass:rgba(255,255,255,.06);
  --glass-strong:rgba(255,255,255,.10);
  --stroke:rgba(255,255,255,.12);
  --radius:22px;
  --shadow:0 18px 50px -12px rgba(0,0,0,.6);
  --maxw:1200px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Noto Sans SC","Sora",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.brand,.name{font-family:"Sora","Noto Sans SC",sans-serif}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.gradient-text{
  background:var(--grad);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
section{position:relative;z-index:2}

/* 背景流动光晕 */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora span{
  position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;
  background:var(--grad);
  animation:float 18s ease-in-out infinite;
}
.aurora span:nth-child(1){width:46vw;height:46vw;left:-10vw;top:-12vw;animation-delay:0s}
.aurora span:nth-child(2){width:40vw;height:40vw;right:-12vw;top:18vh;animation-delay:-6s;opacity:.38}
.aurora span:nth-child(3){width:38vw;height:38vw;left:25vw;bottom:-16vw;animation-delay:-11s;opacity:.32}
@keyframes float{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(6vw,4vh) scale(1.12)}
  66%{transform:translate(-5vw,-3vh) scale(.95)}
}

/* 粒子画布 */
#burst{position:fixed;inset:0;z-index:60;pointer-events:none}
#herobg{position:absolute;inset:0;z-index:1;pointer-events:none}

/* ===================================================================
   导航栏（玻璃拟态）
=================================================================== */
nav{
  position:fixed;top:0;left:0;right:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 28px;
  background:transparent;
  border-bottom:1px solid transparent;
  transition:background .4s ease,border-color .4s ease,backdrop-filter .4s ease,padding .4s ease;
}
nav.scrolled{
  background:rgba(10,10,22,.55);
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  border-bottom:1px solid var(--stroke);
  padding:12px 28px;
}
.brand{font-weight:800;font-size:20px;letter-spacing:.5px;display:flex;align-items:center;gap:10px}
.brand .dot{width:11px;height:11px;border-radius:50%;background:var(--grad);box-shadow:0 0 14px var(--purple)}
.nav-links{display:flex;align-items:center;gap:6px}
.nav-links a{
  padding:9px 16px;border-radius:999px;font-size:14.5px;color:var(--text-dim);
  transition:color .25s,background .25s;font-weight:500;
}
.nav-links a:hover{color:var(--text);background:var(--glass)}
.nav-actions{display:flex;align-items:center;gap:10px}
.btn-share{
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;color:#fff;
  background:var(--grad);border:none;box-shadow:0 8px 22px -6px var(--purple);
  transition:transform .25s,box-shadow .25s;
}
.btn-share:hover{transform:translateY(-2px);box-shadow:0 12px 30px -6px var(--pink)}
.nav-toggle{display:none;background:none;border:none;color:var(--text);font-size:24px;cursor:pointer}

/* ===================================================================
   Hero 首屏
=================================================================== */
.hero{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:120px 24px 90px;position:relative;
}
.hero .eyebrow{
  display:inline-block;padding:7px 16px;border-radius:999px;font-size:13px;letter-spacing:2px;
  background:var(--glass);border:1px solid var(--stroke);color:var(--text-dim);margin-bottom:26px;
  text-transform:uppercase;
}
.hero h1{
  font-size:clamp(44px,9vw,118px);font-weight:800;line-height:1.02;letter-spacing:-1px;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 10px 40px rgba(168,85,247,.35));
}
.hero .slogan{font-size:clamp(18px,3vw,30px);font-weight:600;margin-top:18px;color:#fff}
.hero .philosophy{max-width:560px;margin:18px auto 0;color:var(--text-dim);font-size:16px}
.scroll-hint{
  position:absolute;bottom:34px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--text-dim);
  font-size:12px;letter-spacing:2px;cursor:pointer;animation:breathe 2.4s ease-in-out infinite;
}
.scroll-hint svg{width:26px;height:26px}
@keyframes breathe{0%,100%{transform:translateX(-50%) translateY(0);opacity:.6}50%{transform:translateX(-50%) translateY(8px);opacity:1}}

/* ===================================================================
   区块标题
=================================================================== */
.section-title{text-align:center;margin-bottom:46px}
.section-title h2{font-size:clamp(30px,5vw,52px);font-weight:800;letter-spacing:-.5px}
.section-title p{color:var(--text-dim);margin-top:10px}
.pad{padding:100px 0}

/* ===================================================================
   分类筛选
=================================================================== */
.filters{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:48px}
.chip{
  padding:11px 22px;border-radius:999px;font-size:14.5px;font-weight:600;cursor:pointer;
  background:var(--glass);border:1px solid var(--stroke);color:var(--text-dim);
  transition:color .3s,transform .25s,border-color .3s,background .3s;
}
.chip:hover{color:var(--text);transform:translateY(-2px)}
.chip.active{color:#fff;background:var(--grad);border-color:transparent;box-shadow:0 10px 26px -8px var(--purple)}

/* ===================================================================
   作品瀑布流
=================================================================== */
.grid{column-count:3;column-gap:22px}
@media(max-width:980px){.grid{column-count:2}}
@media(max-width:600px){.grid{column-count:1}}
.card{
  break-inside:avoid;margin-bottom:22px;border-radius:var(--radius);overflow:hidden;
  position:relative;cursor:pointer;background:var(--bg-soft);
  border:1px solid var(--stroke);box-shadow:var(--shadow);
  transition:transform .4s cubic-bezier(.16,1,.3,1),box-shadow .4s;
}
.card:hover{transform:translateY(-6px) scale(1.015);box-shadow:0 26px 60px -16px rgba(0,0,0,.7)}
.card .cover{width:100%;aspect-ratio:4/5;object-fit:cover;background:linear-gradient(135deg,#1a1a2e,#10101e);display:block;transition:transform .6s cubic-bezier(.16,1,.3,1)}
.card:hover .cover{transform:scale(1.06)}
.card .overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;
  padding:20px;opacity:0;transition:opacity .4s;
  background:linear-gradient(to top,rgba(7,7,16,.92) 8%,rgba(7,7,16,.2) 55%,transparent);
}
.card:hover .overlay{opacity:1}
.card .overlay .cat{
  align-self:flex-start;font-size:11.5px;font-weight:600;letter-spacing:.6px;
  padding:5px 12px;border-radius:999px;background:var(--grad);color:#fff;margin-bottom:10px;
}
.card .overlay .t{font-size:19px;font-weight:700}
.card .lazy-shimmer{position:absolute;inset:0;background:linear-gradient(135deg,#171728,#0e0e1c);animation:shimmer 1.4s infinite}
@keyframes shimmer{0%{opacity:.6}50%{opacity:1}100%{opacity:.6}}

/* ===================================================================
   灯箱
=================================================================== */
.lightbox{
  position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
  background:rgba(5,5,12,.86);backdrop-filter:blur(8px);padding:30px;
}
.lightbox.open{display:flex;animation:fade .35s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.lb-stage{position:relative;max-width:1000px;width:100%;display:flex;flex-direction:column;align-items:center}
.lb-media{
  width:min(100%,900px);max-height:62vh;border-radius:18px;overflow:hidden;background:#000;
  position:relative;display:flex;align-items:center;justify-content:center;
}
.lb-media img,.lb-media video{max-width:100%;max-height:62vh;object-fit:contain}
.lb-media img.zoom{cursor:zoom-in}
.lb-media img.zoomed{cursor:zoom-out;transform:scale(1.8);transition:transform .3s;z-index:5}
.lb-nav{
  position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;
  background:var(--glass-strong);border:1px solid var(--stroke);color:#fff;font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .25s,transform .25s;z-index:6;
}
.lb-nav:hover{background:var(--grad);transform:translateY(-50%) scale(1.08)}
.lb-prev{left:-8px}.lb-next{right:-8px}
@media(max-width:760px){.lb-prev{left:2px}.lb-next{right:2px}}
.lb-close{
  position:absolute;top:-14px;right:-14px;width:42px;height:42px;border-radius:50%;
  background:var(--grad);border:none;color:#fff;font-size:20px;cursor:pointer;z-index:7;
  box-shadow:0 8px 22px -6px var(--purple);
}
.lb-info{text-align:center;margin-top:20px;max-width:720px}
.lb-info .cat{font-size:12.5px;color:var(--text-dim);letter-spacing:1px}
.lb-info h3{font-size:26px;font-weight:800;margin:8px 0}
.lb-info p{color:var(--text-dim);font-size:15px;margin-top:8px}
.lb-count{margin-top:12px;font-size:13px;color:var(--text-dim)}
.lb-fade{animation:lbFade .4s ease}
@keyframes lbFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ===================================================================
   关于我
=================================================================== */
.about-grid{display:grid;grid-template-columns:0.9fr 1.1fr;gap:54px;align-items:center}
@media(max-width:860px){.about-grid{grid-template-columns:1fr;gap:34px}}
.avatar{
  aspect-ratio:1;border-radius:28px;overflow:hidden;border:1px solid var(--stroke);
  box-shadow:var(--shadow);background:linear-gradient(135deg,#1a1a2e,#10101e);position:relative;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.about-text h2{font-size:clamp(28px,4.5vw,46px);font-weight:800;margin-bottom:18px}
.about-text p{color:var(--text-dim);margin-bottom:16px}
.tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.tags span{padding:8px 16px;border-radius:999px;font-size:13.5px;background:var(--glass);border:1px solid var(--stroke)}

/* ===================================================================
   合作咨询
=================================================================== */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px}
@media(max-width:860px){.contact-grid{grid-template-columns:1fr}}
.contact-list{display:flex;flex-direction:column;gap:14px}
.contact-item{
  display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:18px;
  background:var(--glass);border:1px solid var(--stroke);transition:transform .25s,background .25s;
}
.contact-item:hover{transform:translateY(-3px);background:var(--glass-strong)}
.contact-item .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--grad);flex-shrink:0}
.contact-item .ic svg{width:22px;height:22px}
.contact-item .meta b{display:block;font-size:15px}
.contact-item .meta small{color:var(--text-dim);font-size:13px}
.form{display:flex;flex-direction:column;gap:14px;background:var(--glass);border:1px solid var(--stroke);border-radius:20px;padding:26px}
.form input,.form textarea{
  width:100%;padding:14px 16px;border-radius:13px;border:1px solid var(--stroke);
  background:rgba(255,255,255,.04);color:var(--text);font-family:inherit;font-size:14.5px;resize:vertical;
}
.form input:focus,.form textarea:focus{outline:none;border-color:var(--purple);background:rgba(255,255,255,.07)}
.form button{
  margin-top:4px;padding:14px;border-radius:13px;border:none;cursor:pointer;color:#fff;font-weight:700;font-size:15px;
  background:var(--grad);box-shadow:0 10px 26px -8px var(--purple);transition:transform .25s;
}
.form button:hover{transform:translateY(-2px)}

/* ===================================================================
   页脚
=================================================================== */
footer{padding:46px 0 60px;text-align:center;border-top:1px solid var(--stroke);margin-top:40px;position:relative;z-index:2}
footer .fbrand{font-weight:800;font-size:18px;display:inline-flex;align-items:center;gap:9px;margin-bottom:10px}
footer .fbrand .dot{width:9px;height:9px;border-radius:50%;background:var(--grad)}
footer small{color:var(--text-dim)}

/* ===================================================================
   分享弹窗
=================================================================== */
.modal{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:rgba(5,5,12,.8);backdrop-filter:blur(6px);padding:24px}
.modal.open{display:flex;animation:fade .3s ease}
.modal-card{
  width:min(380px,92vw);border-radius:22px;padding:30px;text-align:center;position:relative;
  background:var(--bg-soft);border:1px solid var(--stroke);box-shadow:var(--shadow);
}
.modal-card h3{font-size:22px;font-weight:800;margin-bottom:6px}
.modal-card p{color:var(--text-dim);font-size:13.5px;margin-bottom:18px}
#qrcode{display:flex;justify-content:center;margin:0 auto 18px;padding:14px;background:#fff;border-radius:14px;width:fit-content}
#qrcode img,#qrcode canvas{border-radius:6px}
.share-url{font-size:12px;color:var(--text-dim);word-break:break-all;background:var(--glass);border:1px solid var(--border);
  padding:8px 10px;border-radius:10px;margin-bottom:14px;line-height:1.5}
.share-url .hint{display:block;margin-top:5px;color:#ffb4c8;font-size:11px}
.modal-card .copy{
  width:100%;padding:13px;border-radius:13px;border:none;cursor:pointer;color:#fff;font-weight:700;background:var(--grad);
  transition:transform .25s;
}
.modal-card .copy:hover{transform:translateY(-2px)}
.modal-close{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--text-dim);font-size:24px;cursor:pointer}

/* ===================================================================
   隐藏编辑圆点 & 编辑面板
=================================================================== */
#editDot{
  position:fixed;right:0;bottom:0;width:28px;height:28px;border-radius:50%;z-index:95;
  background:transparent;cursor:pointer;opacity:0;transition:opacity .4s;
  display:flex;align-items:center;justify-content:center;
}
#editDot .dot-core{width:5px;height:5px;border-radius:50%;background:transparent;transition:background .4s}
/* 滚到底部 + 鼠标悬停其上方时才显现微弱光晕 */
#editDot.show.hover{opacity:1}
#editDot.show.hover .dot-core{background:rgba(255,255,255,.2)}
#editDot.show.hover .pulse{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--grad);opacity:.35;animation:dp 2s infinite}
@keyframes dp{0%{transform:scale(1);opacity:.35}100%{transform:scale(3);opacity:0}}

.editor{position:fixed;inset:0;z-index:100;display:none;background:rgba(5,5,12,.92);backdrop-filter:blur(10px);overflow:auto;padding:30px}
.editor.open{display:block}
.editor-in{width:min(860px,94vw);margin:0 auto;background:var(--bg-soft);border:1px solid var(--stroke);border-radius:22px;padding:30px;box-shadow:var(--shadow)}
.editor h2{font-size:24px;font-weight:800;margin-bottom:6px}
.editor .sub{color:var(--text-dim);font-size:13.5px;margin-bottom:22px}
.editor .grp{margin-bottom:24px;border-top:1px solid var(--stroke);padding-top:18px}
.editor .grp > label{display:block;font-weight:700;margin-bottom:12px;font-size:15px}
.editor input[type=text],.editor input[type=email],.editor textarea,.editor select{
  width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--stroke);
  background:rgba(255,255,255,.04);color:var(--text);font-family:inherit;font-size:14px;margin-bottom:10px;
}
.editor textarea{resize:vertical;min-height:70px}
.editor input[type=file]{
  width:100%;padding:9px 12px;border-radius:11px;border:1px dashed var(--stroke);
  background:rgba(255,255,255,.04);color:var(--text-dim);font-family:inherit;font-size:12.5px;margin-bottom:10px;cursor:pointer;
}
.editor input[type=file]::file-selector-button{
  background:var(--grad);color:#fff;border:none;padding:6px 12px;border-radius:8px;margin-right:10px;cursor:pointer;font-weight:600;font-size:12px;
}
.editor .media-list{margin:8px 0}
.editor .media-item{background:rgba(0,0,0,.18);border:1px solid var(--stroke);border-radius:12px;padding:12px;margin-bottom:10px}
.editor .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.editor .row{grid-template-columns:1fr}}
.editor .item{border:1px solid var(--stroke);border-radius:14px;padding:14px;margin-bottom:12px;background:rgba(255,255,255,.03)}
.editor .mini{font-size:12px;color:var(--text-dim);margin-bottom:4px;display:block}
.editor .del{background:#5a1d2e;border-color:#7a2740;color:#ffb3c4}
.editor .add{background:var(--glass);border:1px dashed var(--stroke);color:var(--text);padding:10px;border-radius:11px;cursor:pointer;width:100%;font-weight:600}
.editor .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
.editor .actions button{padding:13px 22px;border-radius:13px;border:none;cursor:pointer;font-weight:700;font-size:14.5px}
.editor .save{background:var(--grad);color:#fff;box-shadow:0 10px 26px -8px var(--purple)}
.editor .reset{background:var(--glass);border:1px solid var(--stroke);color:var(--text-dim)}
.editor .export{background:var(--glass);border:1px solid var(--blue);color:var(--blue)}
.editor .import{background:var(--glass);border:1px solid var(--pink);color:var(--pink)}
.editor .close{background:var(--glass);border:1px solid var(--stroke);color:var(--text-dim)}
.upload-preview{margin:8px 0;border-radius:12px;overflow:hidden;max-width:200px;display:none}
.upload-preview.show{display:block}
.upload-preview img,.upload-preview video{width:100%;border-radius:12px;display:block}
.upload-preview video{max-height:140px;object-fit:cover}
.toast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);z-index:120;
  background:var(--grad);color:#fff;padding:13px 22px;border-radius:999px;font-weight:600;font-size:14px;
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;box-shadow:0 12px 30px -8px var(--purple);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 移动端导航 */
@media(max-width:760px){
  .nav-links{position:fixed;top:64px;right:14px;flex-direction:column;background:rgba(10,10,22,.92);
    backdrop-filter:blur(18px);border:1px solid var(--stroke);border-radius:18px;padding:14px;gap:4px;display:none}
  .nav-links.open{display:flex}
  .nav-toggle{display:block}

<body>

<!-- 背景流动光晕 -->
<div class="aurora"><span></span><span></span><span></span></div>

<!-- 点击粒子迸发画布 -->
<canvas id="burst"></canvas>

<!-- ===================== 导航栏 ===================== -->
<nav id="nav">
  <div class="brand"><span class="dot"></span><span id="navBrand">GIFT ATELIER</span></div>
  <div class="nav-links" id="navLinks">
    <a href="#works" data-nav>作品</a>
    <a href="#about" data-nav>关于我</a>
    <a href="#contact" data-nav>联系合作</a>
  </div>
  <div class="nav-actions">
    <button class="btn-share" id="shareBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg>
      分享
    </button>
    <button class="nav-toggle" id="navToggle">☰</button>
  </div>
</nav>

<!-- ===================== Hero ===================== -->
<header class="hero" id="top">
  <canvas id="herobg"></canvas>
  <span class="eyebrow" id="heroEyebrow">GIFT DESIGN STUDIO</span>
  <h1 id="heroName">礼物设计师</h1>
  <div class="slogan" id="heroSlogan">让每一份心意，都被精心包装</div>
  <p class="philosophy" id="heroPhilosophy">用色彩、材质与故事，把看不见的情感，变成拿在手里的惊喜。</p>
  <div class="scroll-hint" id="scrollHint">
    <span>SCROLL</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
  </div>
</header>

<!-- ===================== 作品 ===================== -->
<section class="pad" id="works">
  <div class="wrap">
    <div class="section-title">
      <h2 class="gradient-text">精选作品</h2>
      <p>每一次拆封，都是一次心动的预演</p>
    </div>
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
  </div>
</section>

<!-- ===================== 关于我 ===================== -->
<section class="pad" id="about">
  <div class="wrap">
    <div class="about-grid">
      <div class="avatar" id="aboutAvatar"></div>
      <div class="about-text">
        <h2 class="gradient-text" id="aboutHeading">关于我</h2>
        <p id="aboutBio"></p>
        <div class="tags" id="aboutTags"></div>
      </div>
    </div>
  </div>
</section>

<!-- ===================== 合作咨询 ===================== -->
<section class="pad" id="contact">
  <div class="wrap">
    <div class="section-title">
      <h2 class="gradient-text">合作咨询</h2>
      <p>有想法？我们一起把它变成现实</p>
    </div>
    <div class="contact-grid">
      <div class="contact-list" id="contactList"></div>
      <form class="form" id="contactForm">
        <input type="text" placeholder="你的称呼" required />
        <input type="email" placeholder="邮箱（方便回复你）" required />
        <textarea placeholder="简单聊聊你的合作需求…" rows="4" required></textarea>
        <button type="submit">发送合作需求</button>
      </form>
    </div>
  </div>
</section>

<!-- ===================== 页脚 ===================== -->
<footer>
  <div class="wrap">
    <div class="fbrand"><span class="dot"></span><span id="footBrand">GIFT ATELIER</span></div>
    <small id="footCopy">© 2026 礼物设计师 · 保留所有权利</small>
  </div>
</footer>

<!-- ===================== 灯箱 ===================== -->
<div class="lightbox" id="lightbox">
  <div class="lb-stage">
    <button class="lb-close" id="lbClose">✕</button>
    <div class="lb-media" id="lbMedia"></div>
    <button class="lb-nav lb-prev" id="lbPrev">‹</button>
    <button class="lb-nav lb-next" id="lbNext">›</button>
    <div class="lb-info">
      <div class="cat" id="lbCat"></div>
      <h3 id="lbTitle"></h3>
      <p id="lbIntro"></p>
      <div class="lb-count" id="lbCount"></div>
    </div>
  </div>
</div>

<!-- ===================== 分享弹窗 ===================== -->
<div class="modal" id="shareModal">
  <div class="modal-card">
    <button class="modal-close" id="shareClose">✕</button>
    <h3>分享这个作品集</h3>
    <p>用手机扫码，或复制链接分享给更多人</p>
    <div id="qrcode"></div>
    <div class="share-url" id="shareUrlText"></div>
    <button class="copy" id="copyLink">复制链接</button>
  </div>
</div>

<!-- ===================== 隐藏编辑圆点 ===================== -->
<div id="editDot"><span class="dot-core"></span><span class="pulse"></span></div>

<!-- ===================== 编辑面板 ===================== -->
<div class="editor" id="editor">
  <div class="editor-in">
    <h2>内容编辑面板</h2>
    <div class="sub">上传图片/视频后点「保存更改」，<b>自动同步到服务器，所有设备（手机+电脑）立即可见</b>。<br/>无需手动导出/导入，刷新或换设备打开都能看到最新内容。</div>
    <div id="editorBody"></div>
    <div class="actions">
      <button class="save" id="edSave">保存更改</button>
      <button class="reset" id="edReset">恢复默认</button>
      <button class="export" id="edExport">导出配置</button>
      <button class="import" id="edImportBtn">导入配置</button>
      <input type="file" accept=".json,application/json" id="edImportFile" style="display:none"/>
      <button class="close" id="edClose">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 二维码生成器（内联） -->
<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php

// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;

const PALETTE=[
  ["#3b6bff","#a855f7","#ff6f9d"],
  ["#a855f7","#ff6f9d","#ffb86b"],
  ["#3b6bff","#22d3ee","#a855f7"],
  ["#ff6f9d","#a855f7","#3b6bff"],
  ["#22d3ee","#3b6bff","#a855f7"],
  ["#ff6f9d","#ffb86b","#a855f7"]
];
// 生成渐变 SVG 封面（离线可用）
function autoCover(seed,label){
  const p=PALETTE[seed%PALETTE.length];
  const id="g"+seed;
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='800' height='1000'>
    <defs><linearGradient id='${id}' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0' stop-color='${p[0]}'/><stop offset='0.55' stop-color='${p[1]}'/><stop offset='1' stop-color='${p[2]}'/>
    </linearGradient></defs>
    <rect width='800' height='1000' fill='url(#${id})'/>
    <circle cx='640' cy='220' r='150' fill='rgba(255,255,255,.18)'/>
    <circle cx='160' cy='780' r='190' fill='rgba(0,0,0,.12)'/>
    <circle cx='420' cy='520' r='90' fill='rgba(255,255,255,.14)'/>
    <text x='60' y='930' font-family='Sora,sans-serif' font-size='54' font-weight='800' fill='rgba(255,255,255,.92)'>${label||''}</text>
  </svg>`;
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}

/* =====================================================================
   配置持久化（IndexedDB，容量数百MB，支持大视频/图片）
   另提供导出/导入 JSON 实现跨设备迁移
===================================================================== */
const IDB_NAME="gift_portfolio",IDB_STORE="kv",IDB_KEY="config_v1";
function idbOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(IDB_NAME,1);
    r.onupgradeneeded=()=>{r.result.createObjectStore(IDB_STORE);};
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
async function idbGet(key){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const tx=db.transaction(IDB_STORE,"readonly");
    const rq=tx.objectStore(IDB_STORE).get(key);
    rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error);
  });
}
async function idbSet(key,val){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const tx=db.transaction(IDB_STORE,"readwrite");
    tx.objectStore(IDB_STORE).put(val,key);
    tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);
  });
}
async function idbDel(key){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const tx=db.transaction(IDB_STORE,"readwrite");
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);
  });
}

// 为缺封面的作品生成媒体封面
function ensureMedia(C){
  C.WORKS.forEach((w,i)=>{
    w.media.forEach((m,j)=>{
      if(m.type==="image" && !m.src) m.src=autoCover(i*3+j, w.title+" "+(j+1));
      if(m.type==="video" && !m.poster) m.poster=autoCover(i*3+j+1, w.title);
    });
    if(!w.cover) w.cover=autoCover(i, w.title);
  });
  if(!C.ABOUT.avatar) C.ABOUT.avatar=autoCover(2,"ATELIER");
  return C;
}

const io=new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){

      img.src=img.dataset.src;

}

===================================================================== */
const bcanvas=$("#burst"),bctx=bcanvas.getContext("2d");
let particles=[];
function resizeB(){bcanvas.width=innerWidth;bcanvas.height=innerHeight;}
resizeB();addEventListener("resize",resizeB);
function spawnBurst(x,y){
  const cols=["#3b6bff","#a855f7","#ff6f9d","#22d3ee","#ffb86b"];
  for(let i=0;i<22;i++){
    const a=Math.random()*Math.PI*2,sp=2+Math.random()*5;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,
      r:3+Math.random()*5,life:1,col:cols[(Math.random()*cols.length)|0]});
  }
  if(!burstRunning)loopBurst();
}
let burstRunning=false;
function loopBurst(){
  burstRunning=true;
  bctx.clearRect(0,0,bcanvas.width,bcanvas.height);
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.vx*=0.98;p.life-=0.016;
    bctx.globalAlpha=Math.max(p.life,0);
    bctx.beginPath();bctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    bctx.fillStyle=p.col;bctx.fill();
  });
  bctx.globalAlpha=1;
  particles=particles.filter(p=>p.life>0);
  if(particles.length)requestAnimationFrame(loopBurst);
  else{bctx.clearRect(0,0,bcanvas.width,bcanvas.height);burstRunning=false;}
}
// 任意位置点击触发（交互元素内部也允许，增添趣味）
document.addEventListener("click",e=>{
  if(e.target.closest("#editDot"))return;

});

function resizeH(){const r=hc.parentElement.getBoundingClientRect();hc.width=r.width;hc.height=r.height;}
function initH(){
  resizeH();
  hparts=[];
  const n=Math.min(46,Math.floor(hc.width/26));
  for(let i=0;i<n;i++)hparts.push({
    x:Math.random()*hc.width,y:Math.random()*hc.height,
    r:1+Math.random()*2.6,vy:-0.2-Math.random()*0.5,
    vx:(Math.random()-0.5)*0.3,a:.15+Math.random()*.4,
    c:["#3b6bff","#a855f7","#ff6f9d"][(Math.random()*3)|0]
  });
}
function loopH(){
  hctx.clearRect(0,0,hc.width,hc.height);
  hparts.forEach(p=>{
    p.y+=p.vy;p.x+=p.vx;
    if(p.y< -10){p.y=hc.height+10;p.x=Math.random()*hc.width;}
    hctx.globalAlpha=p.a;hctx.beginPath();hctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    hctx.fillStyle=p.c;hctx.fill();
  });
  hctx.globalAlpha=1;
  requestAnimationFrame(loopH);
}

let draft=null;
// 转义，避免内容里的引号破坏 HTML 属性
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
// 上传文件到服务器，返回 URL（所有设备可访问）
function readFile(input,cb){
  const f=input.files&&input.files[0];if(!f)return;
  const fd=new FormData();
  fd.append("file",f);
  // 先用 FileReader 生成本地预览（即时显示），同时上传到服务器
  const r=new FileReader();
  r.onload=()=>{
    cb(r.result); // 本地预览
    // 上传到服务器，拿到 URL 后替换 draft 中的 DataURL
    fetch("/api/upload",{method:"POST",body:fd})
      .then(r=>r.json())
      .then(data=>{
        if(data.url){
          // 在 draft 中找到对应的 DataURL 并替换为服务器 URL
          replaceInDraft(r.result,data.url);
        }
      })
      .catch(e=>toast("上传失败，仅本地预览"));
  };
  r.readAsDataURL(f);
}
// 在 draft 中把旧值替换为新值（上传后的 URL 替换临时 DataURL）
function replaceInDraft(oldVal,newVal){
  if(!draft)return;
  // 头像
  if(draft.ABOUT.avatar===oldVal)draft.ABOUT.avatar=newVal;
  // 作品封面和素材
  draft.WORKS.forEach(w=>{
    if(w.cover===oldVal)w.cover=newVal;
    w.media.forEach(m=>{if(m.src===oldVal)m.src=newVal;});
  });
}

  a.href=url;
  a.download="portfolio-config.json";
  a.click();
  URL.revokeObjectURL(url);
  toast("配置已导出为 JSON 文件");
});
// 导入 JSON 配置文件
$("#edImportBtn").addEventListener("click",()=>$("#edImportFile").click());
$("#edImportFile").addEventListener("change",async(e)=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  try{
    const text=await f.text();
    const imported=JSON.parse(text);
    if(!imported.WORKS||!imported.SITE){toast("文件格式不正确");return;}
    draft=imported;
    renderEditorLists();
    toast("配置已导入，请检查后点击「保存更改」");
  }catch(err){
    toast("导入失败："+(err.message||err));
  }
  e.target.value="";
});

function buildEditor(){
  const body=$("#editorBody");
  const S=draft.SITE,A=draft.ABOUT;
  let html=`
  <div class="grp">
    <label>网站基础信息</label>
    <div class="row">
      <input type="text" data-k="SITE.brand" value="${S.brand}" placeholder="品牌名"/>
      <input type="text" data-k="SITE.copyright" value="${S.copyright}" placeholder="版权"/>
    </div>
    <input type="text" data-k="SITE.heroEyebrow" value="${S.heroEyebrow}" placeholder="Hero 小标"/>
    <input type="text" data-k="SITE.heroName" value="${S.heroName}" placeholder="Hero 大标题"/>
    <input type="text" data-k="SITE.heroSlogan" value="${S.heroSlogan}" placeholder="标语"/>
    <input type="text" data-k="SITE.heroPhilosophy" value="${S.heroPhilosophy}" placeholder="设计理念"/>
  </div>
  <div class="grp">
    <label>关于我</label>
    <input type="text" data-k="ABOUT.heading" value="${A.heading}" placeholder="标题"/>
    <input type="text" data-k="ABOUT.avatar" value="${A.avatar}" placeholder="头像路径（留空自动生成）"/>
    <small class="mini">或上传头像图片（将内嵌保存）</small>
    <input type="file" accept="image/*" data-up="avatar" />
    <div class="upload-preview" data-preview="avatar"></div>
    <textarea data-k="ABOUT.bio" placeholder="简介">${A.bio}</textarea>
    <small class="mini">擅长领域（逗号分隔）</small>
    <input type="text" data-k="ABOUT.tags" value="${A.tags.join(",")}" placeholder="标签"/>
  </div>`;
  // 联系方式
  html+=`<div class="grp"><label>联系方式</label><div id="edContacts"></div>
    <button class="add" data-add="contact">+ 添加联系方式</button></div>`;
  // 分类
  html+=`<div class="grp"><label>分类（首项「全部」不可删）</label><div id="edCats"></div>
    <button class="add" data-add="cat">+ 添加分类</button></div>`;
  // 作品
  html+=`<div class="grp"><label>作品列表</label><div id="edWorks"></div>
    <button class="add" data-add="work">+ 添加作品</button></div>`;
  body.innerHTML=html;

  // 绑定基础字段
  body.querySelectorAll("[data-k]").forEach(el=>{
    el.addEventListener("input",()=>{
      const ks=el.dataset.k.split(".");
      if(ks[0]==="SITE")draft.SITE[ks[1]]=el.value;
      else if(ks[0]==="ABOUT"){
        if(ks[1]==="tags")draft.ABOUT.tags=el.value.split(",").map(s=>s.trim()).filter(Boolean);
        else draft.ABOUT[ks[1]]=el.value;
      }
    });
  });
  // 头像上传
  const av=body.querySelector('[data-up="avatar"]');
  if(av)av.addEventListener("change",function(){readFile(this,data=>{
    draft.ABOUT.avatar=data;
    let prev=this.nextElementSibling;
    if(!prev||!prev.classList.contains("upload-preview")){
      prev=document.createElement("div");prev.className="upload-preview show";
      this.parentNode.insertBefore(prev,this.nextSibling);
    }
    prev.innerHTML='<img src="'+data+'" />';
  });});
  // 添加按钮
  body.querySelector('[data-add="contact"]').addEventListener("click",()=>{draft.CONTACTS.push({type:"mail",label:"新联系",value:""});renderEditorLists();});
  body.querySelector('[data-add="cat"]').addEventListener("click",()=>{draft.CATEGORIES.push("新分类");renderEditorLists();});
  body.querySelector('[data-add="work"]').addEventListener("click",()=>{
    draft.WORKS.push({id:"w"+(Date.now()),category:draft.CATEGORIES[1]||"全部",title:"新作品",ratio:"4/5",intro:"",cover:"",media:[{type:"image",src:""}]});
    renderEditorLists();
  });
  renderEditorLists();
}
function mediaItemHTML(i,j,m){
  const uploaded=String(m.src).startsWith('data:');
  const isImg=m.type==="image"&&uploaded;
  const isVid=m.type==="video"&&uploaded;
  return `<div class="media-item">
    <div class="row">
      <select data-mi="type" data-w="${i}" data-m="${j}">
        <option value="image" ${m.type==="image"?"selected":""}>图片</option>
        <option value="video" ${m.type==="video"?"selected":""}>视频</option>
      </select>
      <input type="text" data-mi="src" data-w="${i}" data-m="${j}" value="${uploaded?'(已上传'+(m.type==='video'?'视频':'图片')+' ✓)':esc(m.src)}" placeholder="路径/URL（可空，或下方上传）"/>
    </div>
    ${isImg?`<div class="upload-preview show"><img src="${m.src}" /></div>`:''}
    ${isVid?`<div class="upload-preview show"><video src="${m.src}" muted></video><span class="mini">视频已上传 ✓</span></div>`:''}
    <small class="mini">上传${m.type==="video"?"视频":"图片"}文件（内嵌保存）</small>
    <input type="file" accept="${m.type==="video"?"video/*":"image/*"}" data-up="media" data-w="${i}" data-m="${j}" />
    <button class="add del" data-del="media" data-w="${i}" data-m="${j}">删除素材</button>
  </div>`;
}
function renderEditorLists(){
  // 联系方式
  $("#edContacts").innerHTML=draft.CONTACTS.map((c,i)=>`
    <div class="item">
      <span class="mini">类型(mail/wechat/phone/web)</span>
      <div class="row">
        <input type="text" data-c="${i}" data-f="type" value="${c.type}" placeholder="type"/>
        <input type="text" data-c="${i}" data-f="label" value="${c.label}" placeholder="名称"/>
      </div>
      <input type="text" data-c="${i}" data-f="value" value="${c.value}" placeholder="内容"/>
      <button class="add del" data-del="contact" data-i="${i}">删除</button>
    </div>`).join("");
  // 分类
  $("#edCats").innerHTML=draft.CATEGORIES.map((c,i)=>`
    <div class="item" style="display:flex;gap:10px;align-items:center">
      <input type="text" data-cat="${i}" value="${c}" style="margin:0;flex:1"/>
      ${i===0?'<span class="mini">（固定）</span>':'<button class="add del" data-del="cat" data-i="'+i+'">删除</button>'}
    </div>`).join("");
  // 作品
  $("#edWorks").innerHTML=draft.WORKS.map((w,i)=>`
    <div class="item">
      <div class="row">
        <input type="text" data-w="${i}" data-f="title" value="${esc(w.title)}" placeholder="标题"/>
        <input type="text" data-w="${i}" data-f="category" value="${esc(w.category)}" placeholder="分类"/>
      </div>
      <div class="row">
        <input type="text" data-w="${i}" data-f="cover" value="${String(w.cover).startsWith('data:')?'(已上传封面图 ✓)':esc(w.cover)}" placeholder="封面路径(可空)"/>
        <input type="text" data-w="${i}" data-f="ratio" value="${esc(w.ratio)}" placeholder="比例 4/5"/>
      </div>
      <small class="mini">上传封面图（内嵌保存）</small>
      <input type="file" accept="image/*" data-up="cover" data-w="${i}" />
      ${String(w.cover).startsWith('data:')?`<div class="upload-preview show"><img src="${w.cover}" /></div>`:''}
      <textarea data-w="${i}" data-f="intro" placeholder="介绍">${esc(w.intro)}</textarea>
      <small class="mini">素材（图片/视频）—— 可上传本地文件</small>
      <div class="media-list">${w.media.map((m,j)=>mediaItemHTML(i,j,m)).join("")}</div>
      <button class="add" data-addmedia="${i}">+ 添加素材</button>
      <button class="add del" data-del="work" data-i="${i}">删除该作品</button>
    </div>`).join("");

  // 绑定：联系方式 / 分类 / 作品基础字段
  $("#edContacts").querySelectorAll("[data-c]").forEach(el=>el.addEventListener("input",()=>{draft.CONTACTS[+el.dataset.c][el.dataset.f]=el.value;}));
  $("#edCats").querySelectorAll("[data-cat]").forEach(el=>el.addEventListener("input",()=>{draft.CATEGORIES[+el.dataset.cat]=el.value;}));
  $("#edWorks").querySelectorAll("[data-w]").forEach(el=>el.addEventListener("input",()=>{draft.WORKS[+el.dataset.w][el.dataset.f]=el.value;}));
  // 封面图上传 — 上传后实时显示缩略图
  $("#edWorks").querySelectorAll('[data-up="cover"]').forEach(inp=>inp.addEventListener("change",function(){
    const i=+this.dataset.w;readFile(this,data=>{
      draft.WORKS[i].cover=data;
      const t=$("#edWorks").querySelector('input[data-f="cover"][data-w="'+i+'"]');if(t)t.value="(已上传封面图 ✓)";
      // 实时插入缩略图预览
      let prev=this.nextElementSibling;
      if(!prev||!prev.classList.contains("upload-preview")){
        prev=document.createElement("div");prev.className="upload-preview show";
        this.parentNode.insertBefore(prev,this.nextSibling);
      }
      prev.innerHTML='<img src="'+data+'" />';
    });
  }));
  // 素材上传 — 上传后实时显示缩略图/视频预览
  $("#edWorks").querySelectorAll('[data-up="media"]').forEach(inp=>inp.addEventListener("change",function(){
    const i=+this.dataset.w,j=+this.dataset.m;readFile(this,data=>{
      draft.WORKS[i].media[j].src=data;
      const isVideo=draft.WORKS[i].media[j].type==="video";
      const t=$("#edWorks").querySelector('input[data-mi="src"][data-w="'+i+'"][data-m="'+j+'"]');if(t)t.value="(已上传"+(isVideo?"视频":"图片")+" ✓)";
      // 实时插入预览
      let prev=this.previousElementSibling;
      if(!prev||!prev.classList.contains("upload-preview")){
        prev=document.createElement("div");prev.className="upload-preview show";
        this.parentNode.insertBefore(prev,this);
      }
      if(isVideo){
        prev.innerHTML='<video src="'+data+'" muted></video><span class="mini">视频已上传 ✓</span>';
      }else{
        prev.innerHTML='<img src="'+data+'" />';
      }
    });
  }));
  // 素材类型切换
  $("#edWorks").querySelectorAll('[data-mi="type"]').forEach(sel=>sel.addEventListener("change",function(){const i=+this.dataset.w,j=+this.dataset.m;draft.WORKS[i].media[j].type=this.value;renderEditorLists();}));
  // 添加素材
  $("#edWorks").querySelectorAll("[data-addmedia]").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.addmedia;draft.WORKS[i].media.push({type:"image",src:""});renderEditorLists();}));
  // 删除（含素材）
  document.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{
    const kind=b.dataset.del;
    if(kind==="contact")draft.CONTACTS.splice(+b.dataset.i,1);
    else if(kind==="cat")draft.CATEGORIES.splice(+b.dataset.i,1);
    else if(kind==="work")draft.WORKS.splice(+b.dataset.i,1);
    else if(kind==="media")draft.WORKS[+b.dataset.w].media.splice(+b.dataset.m,1);
    renderEditorLists();
  }));
}

/* =====================================================================
   全量渲染
===================================================================== */
function applyAll(){
  renderBasics();
  renderFilters();
  renderGrid();
}
applyAll();
</script>
